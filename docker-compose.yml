services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chomage
      POSTGRES_PASSWORD: chomage
      POSTGRES_DB: chomage
    ports:
      - "5439:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chomage"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://chomage:chomage@db:5432/chomage
    ports:
      - "8010:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8010
    ports:
      - "3010:3000"
    depends_on:
      - backend

volumes:
  db_data:
